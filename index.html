<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tábori Stopper</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2196F3" />
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: #f0f8ff;
      color: #333;
      padding: 2em;
    }
    h1 { color: #2196F3; }
    #timer { font-size: 4em; margin: 1em 0; }
    button {
      font-size: 1.2em;
      margin: 0.5em;
      padding: 0.5em 1em;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    .start { background-color: #4CAF50; color: white; }
    .stop { background-color: #f44336; color: white; }
    .reset { background-color: #ff9800; color: white; }
  </style>
</head>
<body>
  <h1>Tábori Stopper</h1>
  <div id="timer">00:00.0</div>
  <button class="start" onclick="startTimer()">Indítás</button>
  <button class="stop" onclick="stopTimer()">Megállítás</button>
  <button class="reset" onclick="resetTimer()">Visszaállítás</button>

  <script>
    let startTime, interval;
    let running = false;

    function formatTime(ms) {
      let totalSeconds = Math.floor(ms / 1000);
      let minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
      let seconds = String(totalSeconds % 60).padStart(2, '0');
      let tenths = String(Math.floor((ms % 1000) / 100));
      return `${minutes}:${seconds}.${tenths}`;
    }

    function updateDisplay(ms) {
      document.getElementById('timer').textContent = formatTime(ms);
    }

    function startTimer() {
      if (running) return;
      running = true;
      startTime = Date.now() - (window.elapsed || 0);
      interval = setInterval(() => {
        window.elapsed = Date.now() - startTime;
        updateDisplay(window.elapsed);
      }, 100);
    }

    function stopTimer() {
      if (!running) return;
      running = false;
      clearInterval(interval);
    }

    function resetTimer() {
      stopTimer();
      window.elapsed = 0;
      updateDisplay(0);
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(reg => console.log('Service Worker regisztrálva!', reg))
        .catch(err => console.error('SW hiba:', err));
    }

    updateDisplay(0);
  </script>
</body>
</html>
