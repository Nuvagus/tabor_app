<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kviddics Időzítő</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#FFD700" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Kviddics Időzítő</h1>
  <div class="settings">
    <div>
      <label for="sitout-time">Kiülési idő (mp):</label>
      <input type="number" id="sitout-time" min="1" value="30" aria-label="Kiülési idő másodpercben" />
    </div>
    <div>
      <label for="player-count">Hajtók száma:</label>
      <select id="player-count" aria-label="Hajtók számának kiválasztása">
        <option value="3">3 hajtó</option>
        <option value="6">6 hajtó</option>
      </select>
    </div>
  </div>
  <div class="player-list" role="tablist" aria-label="Játékos időzítők">
    <!-- Játékosok dinamikusan generálva -->
  </div>

  <script src="script.js"></script>
</body>
</html>
